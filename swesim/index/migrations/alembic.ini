# Alembic configuration of the swesim index. Forward-only revisions live in ./versions.
# The database URL is never written here: env.py takes the connection `IndexStore.migrate()` passes, or builds one from
# `swesim.settings.Settings.database_url` (SWESIM_DATABASE_URL) for the `alembic` CLI:
#   uv run alembic -c swesim/index/migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

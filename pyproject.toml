[project]
name = "swesim"
version = "0.1.0"
description = "A pipeline that turns underspecified software issues into multi-turn, gradable Harbor tasks with a simulated stakeholder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=0.40",
  "openai>=1.50",
  "pandas>=2.2",
  "datasets>=3.0",
  "rich>=13.7",
  "harbor[modal]==0.23.0",
  "modal==1.5.5",
  "temporalio>=1.8",
  "python-dotenv>=1.2.3",
  "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
swesim = "swesim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swesim"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
